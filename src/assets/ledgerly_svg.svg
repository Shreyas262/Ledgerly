<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background & Base Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2E62"/>
      <stop offset="50%" stop-color="#141726"/>
      <stop offset="100%" stop-color="#11131F"/>
    </linearGradient>

    <!-- Main Accent Gradient (Indigo) -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3358D4"/>
      <stop offset="50%" stop-color="#3E63DD"/>
      <stop offset="100%" stop-color="#9EB1FF"/>
    </linearGradient>

    <!-- Secondary Accent (Light Indigo) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6E1FF"/>
      <stop offset="100%" stop-color="#9EB1FF"/>
    </linearGradient>

    <!-- Card Glassmorphism Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Metallic/Glow Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9EB1FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#9EB1FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D6E1FF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3E63DD" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Grid/Structure Pattern -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2"/>
  
  <g filter="url(#dropShadow)">
    <!-- Ledger Book Back Cover / Base Frame -->
    <rect x="96" y="88" width="320" height="336" rx="24" fill="#141726" stroke="#3A4F97" stroke-width="3"/>

    <!-- Layered Ledger Pages (Depth Effect) -->
    <path d="M 120 120 L 392 120 A 8 8 0 0 1 400 128 L 400 136 A 8 8 0 0 1 392 144 L 120 144 Z" fill="#182449" opacity="0.8"/>
    
    <!-- Main Glassmorphism Ledger Body -->
    <rect x="112" y="128" width="288" height="280" rx="20" fill="url(#glassGrad)" stroke="url(#lineGrad)" stroke-width="2"/>

    <!-- Ledger Binding / Left Accent Spine -->
    <rect x="112" y="128" width="18" height="280" rx="4" fill="url(#accentGrad)"/>
    
    <!-- Spine Ring Cuts (Binder Look) -->
    <line x1="120" y1="168" x2="138" y2="168" stroke="#141726" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="224" x2="138" y2="224" stroke="#141726" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="280" x2="138" y2="280" stroke="#141726" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="336" x2="138" y2="336" stroke="#141726" stroke-width="3" stroke-linecap="round"/>

    <!-- Dynamic Expense Chart Bar Elements (Ledger Data Lines) -->
    <g opacity="0.4">
      <line x1="160" y1="344" x2="368" y2="344" stroke="#5A6169" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="160" y1="288" x2="368" y2="288" stroke="#5A6169" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="160" y1="232" x2="368" y2="232" stroke="#5A6169" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="160" y1="176" x2="368" y2="176" stroke="#5A6169" stroke-width="2" stroke-dasharray="4 4"/>
    </g>

    <!-- Upward Trend Growth Area (Expense / Analytics Visual) -->
    <path d="M 176 320 L 224 272 L 272 288 L 352 192 L 352 344 L 176 344 Z" fill="url(#accentGrad)" opacity="0.15"/>

    <!-- Upward Trend Line graph -->
    <path d="M 176 320 L 224 272 L 272 288 L 344 196" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Geometric "L" Shape / Growth Arrow (Ledgerly Brand Mark) -->
    <g filter="url(#brandGlow)">
      <!-- Main Ascending Arrow Pillar -->
      <path d="M 176 352 L 176 184 C 176 175.163 183.163 168 192 168 L 208 168 C 216.837 168 224 175.163 224 184 L 224 304 L 336 304 C 344.837 304 352 311.163 352 320 L 352 336 C 352 344.837 344.837 352 336 352 L 192 352 C 183.163 352 176 344.837 176 352 Z" fill="url(#accentGrad)"/>
      
      <!-- Arrow Head Pointing Up and Right (Growth/Success) -->
      <path d="M 310 160 L 368 160 C 372.418 160 376 163.582 376 168 L 376 226 C 376 231.523 369.314 234.285 365.404 230.375 L 347 211.971 L 293.657 265.314 C 290.533 268.438 285.467 268.438 282.343 265.314 L 270.343 253.314 C 267.219 250.19 267.219 245.124 270.343 242 000 L 323.686 188.657 L 305.625 170.596 C 301.715 166.686 304.477 160 310 160 Z" fill="#9EB1FF"/>
    </g>

    <!-- Highlighting Node Points -->
    <circle cx="224" cy="272" r="6" fill="#D6E1FF"/>
    <circle cx="272" cy="288" r="6" fill="#D6E1FF"/>
    <circle cx="344" cy="196" r="7" fill="#C1D0FF" filter="url(#brandGlow)"/>

    <!-- Subtle Floating Currency/Detail Accents -->
    <circle cx="330" cy="136" r="16" fill="#182449" stroke="#9EB1FF" stroke-width="2"/>
    <text x="330" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#9EB1FF" text-anchor="middle">&#8377;</text>
  </g>
</svg>
